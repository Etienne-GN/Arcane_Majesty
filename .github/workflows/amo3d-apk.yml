# Arcane Majesty 3D — builds the Android APK when a tag like amo3d-v0.2.0 is pushed, and publishes it as a GitHub
# release. The app checks these releases for updates (apps/amo3d/src/game/updates.js).
# Signing: the secret AMO3D_KEYSTORE_B64 holds the keystore the phones' installs are signed with (base64), so a release
# installs over an existing install and keeps its saves.
name: amo3d APK

on:
  push:
    tags: ['amo3d-v*']
  workflow_dispatch:

permissions:
  contents: read   # each job asks for what it needs; only the publishing jobs may write

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/amo3d
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the whole history and tags, for the changelog

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/amo3d/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # The Ubuntu runners ship the Android SDK (ANDROID_HOME); Gradle fetches any missing platform itself.

      - name: Version from the tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#amo3d-v}"
          [ "$VER" = "$TAG" ] && VER="0.0.0"
          IFS=. read -r MA MI PA <<< "$VER"
          echo "AMO_VERSION_NAME=$VER" >> "$GITHUB_ENV"
          echo "AMO_VERSION_CODE=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))" >> "$GITHUB_ENV"
          echo "VITE_APP_VERSION=$VER" >> "$GITHUB_ENV"

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.AMO3D_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/amo3d.keystore"
            echo "AMO_KEYSTORE=$RUNNER_TEMP/amo3d.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No AMO3D_KEYSTORE_B64 secret — the APK is signed with a throwaway key and will not install over an existing install."
          fi

      - run: npm ci
      - run: npx vite build
      - run: npx cap sync android
      - name: Build the APK
        run: |   # not debuggable, no WebView inspection; Maven Central sometimes drops a download — try again before failing
          cd android
          for try in 1 2 3; do ./gradlew assembleRelease --no-daemon -q && exit 0; echo "build attempt $try failed, retrying"; sleep $((try * 30)); done
          exit 1
      - name: Name it
        run: cp android/app/build/outputs/apk/release/app-release.apk "ArcaneMajesty3D-${AMO_VERSION_NAME}.apk"

      - name: Keep the APK (even if publishing fails)
        uses: actions/upload-artifact@v4
        with:
          name: ArcaneMajesty3D-${{ env.AMO_VERSION_NAME }}
          path: apps/amo3d/ArcaneMajesty3D-*.apk
          retention-days: 1   # (only carries the build to the publishing job; the release keeps the file)

  # Publishing: the only job (with desktop-release) that holds a write token. It installs and builds nothing — it takes
  # the APK the build job left and writes the release notes from the git history (tools/changelog.mjs, node builtins only).
  publish:
    needs: apk
    if: startsWith(github.ref, 'refs/tags/amo3d-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/amo3d
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the whole history and tags, for the changelog
      - uses: actions/download-artifact@v4
        with:
          pattern: ArcaneMajesty3D-*
          merge-multiple: true
          path: apps/amo3d
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${GITHUB_REF_NAME#amo3d-v}"
          node tools/changelog.mjs "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          for try in 1 2 3 4; do   # GitHub has refused the token now and then (HTTP 403); try again before failing
            if gh release create "$GITHUB_REF_NAME" "ArcaneMajesty3D-${VER}.apk" \
            --title "Arcane Majesty 3D ${VER}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --target "$GITHUB_SHA"; then exit 0; fi
            sleep $((try * 20))
          done
          exit 1

  # The desktop app (Electron, apps/amo3d/desktop): the same web build in its own window — a portable Windows .exe and
  # a Linux AppImage. Built with a read-only token from a committed lockfile (npm ci); a separate small job, the only
  # one allowed to write, attaches them to the release the APK job published. Linux also starts it once on a virtual
  # screen and keeps a screenshot (an artifact) to show it runs.
  desktop:
    needs: apk
    if: startsWith(github.ref, 'refs/tags/amo3d-v')
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/amo3d
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/amo3d/package-lock.json
            apps/amo3d/desktop/package-lock.json

      - name: Version from the tag
        run: |
          VER="${GITHUB_REF_NAME#amo3d-v}"
          echo "AMO_VERSION_NAME=$VER" >> "$GITHUB_ENV"
          echo "VITE_APP_VERSION=$VER" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npx vite build

      - name: Build the desktop app
        run: |
          rm -rf desktop/app && cp -r dist desktop/app
          cd desktop
          npm ci --no-audit --no-fund
          npm pkg set version="$AMO_VERSION_NAME"
          npx electron-builder --publish never

      - name: Start it once (Linux, virtual screen)
        if: runner.os == 'Linux'
        run: |
          cd desktop
          AMO_SHOT="$RUNNER_TEMP/desktop.png" timeout 90 xvfb-run -a npx electron . --no-sandbox 2>&1 | tail -20 || true
          test -s "$RUNNER_TEMP/desktop.png"
          cp "$RUNNER_TEMP/desktop.png" release/

      - name: Keep the builds
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            apps/amo3d/desktop/release/ArcaneMajesty3D-*.exe
            apps/amo3d/desktop/release/ArcaneMajesty3D-*.AppImage
            apps/amo3d/desktop/release/desktop.png
          if-no-files-found: error
          retention-days: 1

  desktop-release:
    needs: [desktop, publish]
    if: startsWith(github.ref, 'refs/tags/amo3d-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: builds
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd builds
          files=$(ls ArcaneMajesty3D-* 2>/dev/null | grep -E '\.(exe|AppImage)$')
          [ -n "$files" ] || { echo "no desktop build found"; ls -la; exit 1; }
          for try in 1 2 3 4; do
            if gh release upload "$GITHUB_REF_NAME" $files --clobber; then exit 0; fi
            sleep $((try * 20))
          done
          exit 1
