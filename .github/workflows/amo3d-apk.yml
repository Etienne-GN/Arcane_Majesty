# Arcane Majesty 3D — builds the Android APK when a tag like amo3d-v0.2.0 is pushed, and publishes it as a GitHub
# release. The app checks these releases for updates (apps/amo3d/src/game/updates.js).
# Signing: the secret AMO3D_KEYSTORE_B64 holds the keystore the phones' installs are signed with (base64), so a release
# installs over an existing install and keeps its saves.
name: amo3d APK

on:
  push:
    tags: ['amo3d-v*']
  workflow_dispatch:

permissions:
  contents: read   # each job asks for what it needs; only the publishing jobs may write

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/amo3d
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the whole history and tags, for the changelog

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/amo3d/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # The Ubuntu runners ship the Android SDK (ANDROID_HOME); Gradle fetches any missing platform itself.

      - name: Version from the tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#amo3d-v}"
          [ "$VER" = "$TAG" ] && VER="0.0.0"
          IFS=. read -r MA MI PA <<< "$VER"
          echo "AMO_VERSION_NAME=$VER" >> "$GITHUB_ENV"
          echo "AMO_VERSION_CODE=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))" >> "$GITHUB_ENV"
          echo "VITE_APP_VERSION=$VER" >> "$GITHUB_ENV"

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.AMO3D_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/amo3d.keystore"
            echo "AMO_KEYSTORE=$RUNNER_TEMP/amo3d.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No AMO3D_KEYSTORE_B64 secret — the APK is signed with a throwaway key and will not install over an existing install."
          fi

      - run: npm ci
      - run: npx vite build
      - run: npx cap sync android
      - name: Build the APK
        run: |   # not debuggable, no WebView inspection; Maven Central sometimes drops a download — try again before failing
          cd android
          for try in 1 2 3; do ./gradlew assembleRelease --no-daemon -q && exit 0; echo "build attempt $try failed, retrying"; sleep $((try * 30)); done
          exit 1
      - name: Name it
        run: cp android/app/build/outputs/apk/release/app-release.apk "ArcaneMajesty3D-${AMO_VERSION_NAME}.apk"

      - name: Keep the APK (even if publishing fails)
        uses: actions/upload-artifact@v4
        with:
          name: ArcaneMajesty3D-${{ env.AMO_VERSION_NAME }}
          path: apps/amo3d/ArcaneMajesty3D-*.apk
          retention-days: 1   # (only carries the build to the publishing job; the release keeps the file)

  # Publishing: the only job that holds a write token. It installs and builds nothing — it takes
  # the APK the build job left and writes the release notes from the git history (tools/changelog.mjs, node builtins only).
  publish:
    needs: apk
    if: startsWith(github.ref, 'refs/tags/amo3d-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/amo3d
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the whole history and tags, for the changelog
      - uses: actions/download-artifact@v4
        with:
          pattern: ArcaneMajesty3D-*
          merge-multiple: true
          path: apps/amo3d
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${GITHUB_REF_NAME#amo3d-v}"
          node tools/changelog.mjs "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          for try in 1 2 3 4; do   # GitHub has refused the token now and then (HTTP 403); try again before failing
            if gh release create "$GITHUB_REF_NAME" "ArcaneMajesty3D-${VER}.apk" \
            --title "Arcane Majesty 3D ${VER}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --target "$GITHUB_SHA"; then exit 0; fi
            sleep $((try * 20))
          done
          exit 1

# The desktop builds (Windows .exe, Linux AppImage) are in amo3d-desktop.yml, started by hand: they took ~7 of the ~10
# billed minutes of every tag (2026-11-25, CI limits).
